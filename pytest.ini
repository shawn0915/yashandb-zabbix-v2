[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = scripts

# 默认跳过集成测试（fixture 内部会自动 skip）
# 启用集成测试：set YAS_ZABBIX_TEST_LIVE=1 && pytest tests/ -v
# 仅运行单元测试：pytest tests/ -v  (fixture 会 skip integration tests)
# 仅运行集成测试：pytest tests/ -v -m integration

markers =
    integration: 集成测试（需 YashanDB Docker + YAS_ZABBIX_TEST_LIVE=1 + YAS_PASSWORD）
    unit: 单元测试（mock，不需要数据库）

# 控制台输出
console_output_style = progress
addopts = -v --tb=short
